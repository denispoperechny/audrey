<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audrey mission control</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1c2330; --muted: #677285; --line: #dde1e8;
    --accent: #1f6feb; --accent-ink: #fff; --error: #c62828; --ok: #1b6e3a; --ok-bg: #d8f3e1;
    --warn: #8a6d00; --warn-bg: #fff4c2; --idle-bg: #e8ebf0; --tool-bg: #eef3fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --ink: #e4e8ef; --muted: #98a2b3; --line: #2c3340;
      --accent: #4c8dff; --accent-ink: #0b0e13; --error: #ff6b6b; --ok: #7fdc9f; --ok-bg: #173323;
      --warn: #ffd866; --warn-bg: #3a3215; --idle-bg: #262c37; --tool-bg: #1c2638;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 1; }
  header h1 { font-size: 18px; margin: 0; }
  .badge { padding: 2px 10px; border-radius: 12px; font-weight: 600; font-size: 13px; }
  .badge.idle { background: var(--idle-bg); color: var(--muted); }
  .badge.running { background: var(--ok-bg); color: var(--ok); }
  .badge.paused { background: var(--warn-bg); color: var(--warn); }
  .muted { color: var(--muted); }
  .spacer { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 5px;
           padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--error); }
  button:disabled, button.primary:disabled { opacity: 1; background: var(--bg); color: var(--muted); border-color: var(--line); font-weight: 400; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; padding: 16px;
         max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; }
  textarea { width: 100%; min-height: 220px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: inherit;
             background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  #error { color: var(--error); min-height: 18px; font-size: 13px; }
  dl.state { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
  dl.state dt { color: var(--muted); }
  dl.state dd { margin: 0; font-variant-numeric: tabular-nums; }
  .entries { display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow: auto; }
  .entry { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--bg); font-size: 13px; }
  .entry .when { color: var(--muted); font-size: 12px; }
  .entry.command { border-left: 3px solid var(--warn); }
  .entry.error { border-left: 3px solid var(--error); }
  .entry .said { margin: 4px 0 0; white-space: pre-wrap; }
  .call { margin-top: 6px; background: var(--tool-bg); border-radius: 5px; padding: 4px 8px; }
  .call summary { cursor: pointer; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .call pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 11px; }
  .note { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .note:last-child { border-bottom: 0; }
  .note.bad { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Audrey mission control</h1>
  <span id="state" class="badge idle">idle</span>
  <span id="state-detail" class="muted"></span>
  <span class="spacer"></span>
  <button id="start" class="primary">Start</button>
  <button id="pause">Pause</button>
  <button id="resume" class="primary">Resume</button>
  <button id="end">End</button>
  <button id="cancel" class="danger">Cancel</button>
</header>
<main>
  <div>
    <section>
      <h2>Mission <span id="mission-saved" class="muted" style="font-weight:400;font-size:12px"></span></h2>
      <textarea id="mission" spellcheck="false" placeholder="What the captain should do: the destination (a position, or a place and how to recognise it), the way there, what to avoid, what to report."></textarea>
      <div class="row">
        <button id="save" class="primary">Save</button>
        <span id="dirty" class="muted"></span>
        <span class="spacer"></span>
        <span class="muted" style="font-size:12px">The captain reads it afresh on every wake-up.</span>
      </div>
      <div id="error"></div>
    </section>
    <section>
      <h2>Boat <span id="boat-age" class="muted" style="font-weight:400;font-size:12px"></span></h2>
      <dl id="boat" class="state"></dl>
    </section>
  </div>
  <div>
    <section>
      <h2>Captain <span class="muted" style="font-weight:400;font-size:12px">decisions, newest first</span></h2>
      <div id="log" class="entries"><span class="muted">Nothing yet.</span></div>
    </section>
    <section>
      <h2>Lookout <span class="muted" style="font-weight:400;font-size:12px">camera notes every 10 s, newest first</span></h2>
      <div id="notes" class="entries"><span class="muted">Nothing yet.</span></div>
    </section>
  </div>
</main>

<script>
const POLL_MS = 2000;
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => { const e = Object.assign(document.createElement(tag), props); e.append(...children); return e; };
const clock = (iso) => iso ? new Date(iso).toISOString().slice(11, 19) + " UTC" : "";  // UTC, as the captain and the lookout tell time
let savedMission = "";
let lastLogKey = "", lastNotesKey = "";

async function api(path, options) {
  const r = await fetch("api" + path, options);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.status + " " + r.statusText);
  return body;
}

function showError(text) { $("error").textContent = text || ""; }

// ---- mission ----
async function loadMission() {
  const m = await api("/mission");
  savedMission = m.text;
  $("mission").value = m.text;
  $("mission-saved").textContent = m.saved_at ? "saved " + clock(m.saved_at) : "not saved yet";
  markDirty();
}
function markDirty() { $("dirty").textContent = $("mission").value !== savedMission ? "unsaved changes" : ""; }
async function saveMission() {
  try {
    const m = await api("/mission", { method: "PUT", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ text: $("mission").value }) });
    savedMission = $("mission").value.trimEnd() + "\n";
    $("mission").value = savedMission;
    $("mission-saved").textContent = "saved " + clock(m.saved_at);
    markDirty();
    showError("");
  } catch (e) { showError("Couldn't save the mission: " + e.message); }
}

// ---- control ----
const ALLOWED = { idle: ["start"], running: ["pause", "end", "cancel"], paused: ["resume", "end", "cancel"] };
async function command(name) {
  if ((name === "end" || name === "cancel") && !confirm(name === "end" ? "End the mission? The boat will be stopped." : "Cancel the mission? The boat will be stopped."))
    return;
  if (name === "start" && $("mission").value !== savedMission && !confirm("The mission has unsaved changes. Start with the saved version?")) return;
  try { await api("/control/" + name, { method: "POST" }); showError(""); poll(); }
  catch (e) { showError(e.message); }
}

function showControl(c) {
  const badge = $("state");
  badge.className = "badge " + c.state;
  badge.textContent = c.state;
  $("state-detail").textContent = c.changed_at ? (c.command + " at " + clock(c.changed_at) + (c.run_id ? " · run " + c.run_id : "")) : "";
  for (const name of ["start", "pause", "resume", "end", "cancel"]) $(name).disabled = !ALLOWED[c.state].includes(name);
}

// ---- boat ----
function showBoat(b) {
  const rows = [];
  const add = (k, v) => rows.push(el("dt", { textContent: k }), el("dd", { textContent: v }));
  if (b.telemetry) { $("boat").replaceChildren(el("dd", { textContent: b.telemetry })); $("boat-age").textContent = ""; return; }
  $("boat-age").textContent = "telemetry " + b.telemetry_age_s + " s old";
  add("Position", typeof b.position === "string" ? b.position : b.position.lat + ", " + b.position.lon);
  add("Heading", b.heading_deg == null ? "—" : b.heading_deg + "°");
  add("Speed", b.speed_m_s == null ? "—" : b.speed_m_s + " m/s");
  add("Control", b.control || "—");
  add("Autopilot", b.autopilot);
  const d = b.destination;
  add("Destination", d ? `${d.distance_m} m at ${d.azimuth_deg}° (${d.relative_bearing_deg > 0 ? "+" : ""}${d.relative_bearing_deg ?? "?"}° from the bow) · ${d.lat}, ${d.lon}` : "none");
  if (b.battery_v) add("Battery", b.battery_v + " V");
  $("boat").replaceChildren(...rows);
}

// ---- captain's log ----
function call(c) {
  const args = c.args == null ? "" : JSON.stringify(c.args);
  return el("details", { className: "call" }, el("summary", { textContent: `${c.name}(${args.length > 80 ? args.slice(0, 80) + "…" : args})` }),
            el("pre", { textContent: (c.args ? "args: " + JSON.stringify(c.args, null, 1) + "\n\n" : "") + "result: " + (c.result ?? "—") }));
}
const kTokens = (n) => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
function tokens(t) {
  return t && t.calls ? ` · ${kTokens(t.in)} in (${Math.round(100 * t.cached / Math.max(1, t.in))}% cached) / ${kTokens(t.out)} out` : "";
}
function entry(e) {
  if (e.kind === "command") {
    const extra = e.command === "start" ? "\n" + (e.mission || "") : e.boat_stop ? " · boat stop: " + e.boat_stop : "";
    return el("div", { className: "entry command" }, el("div", { className: "when", textContent: clock(e.t) + " · run " + (e.run_id || "") }),
              el("div", { className: "said", textContent: "Operator: " + e.command + extra }));
  }
  const node = el("div", { className: "entry" + (e.error ? " error" : "") },
    el("div", { className: "when", textContent: `${clock(e.t)} · wake-up ${e.n}${e.took_s != null ? " · " + e.took_s + " s" : ""}${tokens(e.tokens)}` }));
  if (e.error) node.append(el("div", { className: "said", textContent: "Error: " + e.error }));
  for (const s of e.said || []) node.append(el("div", { className: "said", textContent: s }));
  for (const c of e.tool_calls || []) node.append(call(c));
  return node;
}
function showLog(entries) {
  const key = entries.length ? entries[0].t + entries.length : "";
  if (key === lastLogKey) return;
  lastLogKey = key;
  $("log").replaceChildren(...(entries.length ? entries.map(entry) : [el("span", { className: "muted", textContent: "Nothing yet." })]));
}

// ---- lookout's notes ----
function showNotes(notes) {
  const key = notes.length ? notes[0].t + notes.length : "";
  if (key === lastNotesKey) return;
  lastNotesKey = key;
  $("notes").replaceChildren(...(notes.length ? notes.map((n) => el("div", { className: "note" + (n.status === "ok" ? "" : " bad"), textContent: n.line.replace(/^- /, "") }))
                                                : [el("span", { className: "muted", textContent: "Nothing yet." })]));
}

async function poll() {
  try {
    const s = await api("/status");
    showControl(s.control);
    showBoat(s.boat);
    showLog(s.log);
    showNotes(s.notes);
  } catch (e) { showError("Can't reach mission control: " + e.message); }
}

for (const name of ["start", "pause", "resume", "end", "cancel"]) $(name).addEventListener("click", () => command(name));
$("save").addEventListener("click", saveMission);
$("mission").addEventListener("input", markDirty);
loadMission().catch((e) => showError("Couldn't load the mission: " + e.message));
poll();
setInterval(() => { if (!document.hidden) poll(); }, POLL_MS);
</script>
</body>
</html>
