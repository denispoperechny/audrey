; The processes the mission control container runs side by side (missions/7_autonomous_navigation).
; supervisord starts each one, restarts it if it stops, and sends its output to the container's
; log, each line prefixed with the process name. Add a [program:...] section per process; a
; script that doesn't exist yet is retried a few times and then left stopped (FATAL), the others
; keep running.

[supervisord]
nodaemon=true                 ; stay in the foreground: it is the container's main process
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; So "supervisorctl -c /app/supervisord.conf status" (or restart <name>) works inside the container.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:telemetry_reader]
; writes the boat's MQTT messages into the local telemetry folder (telemetry_service/mqtt_reader.py);
; the other processes read it with telemetry_service.TelemetryProvider
command=python -u -m telemetry_service.mqtt_reader
priority=10                   ; started first
autorestart=true
startretries=5
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:boat_mcp]
; the boat's commands as MCP tools (boat_mcp/server.py): http://localhost:8100/mcp
command=python -u -m boat_mcp.server
priority=20
autorestart=true
startretries=5
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:captain]
; the main navigation cycle: an LLM agent woken 15 s after each previous wake-up ends, with the mission and the boat's state,
; acting through the boat's MCP tools (captain/captain.py)
command=python -u -m captain.captain
priority=30                   ; after the telemetry reader and the boat's MCP server
autorestart=true
startretries=5
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:camera_observation]
; the lookout: looks at the camera's latest picture every 10 s and writes notes on the surroundings
; for the captain (camera_observation/observer.py)
command=python -u -m camera_observation.observer
priority=25
autorestart=true
startretries=5
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:mission_ui]
; the operator's web page (mission_ui/app.py): http://<host>:8200 - write the mission, start /
; pause / resume / end / cancel the captain, watch the boat, the captain's log and the lookout's notes
command=python -u -m mission_ui.app
priority=40
autorestart=true
startretries=5
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:trace_uploader]
; copies the processes' trace files (tracing.py) to the storage account every 30 s
command=python -u -m tracing
priority=5
autorestart=true
startretries=5
stopasgroup=true
stopwaitsecs=15                ; it uploads once more on the way out
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

