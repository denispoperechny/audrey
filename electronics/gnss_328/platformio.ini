; Build with PlatformIO (`pio run`, `pio run -t upload`), or open gnss_328.ino
; in the Arduino IDE (board: "Arduino Pro or Pro Mini", ATmega328P 3.3V 8 MHz).

[platformio]
src_dir = .

[env:pro_mini_3v3]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
build_src_filter = +<gnss_328.ino.cpp>
